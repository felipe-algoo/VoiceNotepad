name: Dependency Audit

on:
  push:
    branches: [main]
    paths:
      - "requirements.txt"
      - "requirements-dev.txt"
  pull_request:
    paths:
      - "requirements.txt"
      - "requirements-dev.txt"
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: requirements.txt requirements-dev.txt
          no-deps: true
          require-hashes: false
          internal-be-careful-extra-flags: "--strict --progress-spinner off"
